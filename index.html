<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Pr-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Praveen Raj is a full-stack AI engineer building agentic systems, MCP tooling, and dependable backend products." />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b0e" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Praveen Raj | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
